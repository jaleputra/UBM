# Proxy all /api/* requests to the serverless function
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200
  force = true

# SPA fallback: redirect all other requests to index.html with HTTP 200
[[redirects]]
